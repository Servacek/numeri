<script>
    const modelViewer = document.getElementById('astronaut');
    const loader = document.getElementById('loader');
    const progressBar = document.getElementById('progress-bar');
    const modelToggle = document.getElementById('modelToggle');

    const MODELS = {
        pcb: 'models/clock-pcb.glb',
        antenna: 'models/clock-with-antenna.glb',
    };

    let modelLoaded = false;
    let highWater = 0;

    function setLoaderVisible(visible) {
        loader.style.display = visible ? 'flex' : 'none';
    }

    // Show loader when the 3D tab becomes visible and model isn't ready yet
    new MutationObserver(() => {
        if (document.getElementById('3dmodel').style.display !== 'none' && !modelLoaded) {
            setLoaderVisible(true);
        }
    }).observe(document.getElementById('3dmodel'), { attributes: true, attributeFilter: ['style'] });

    modelViewer.addEventListener('progress', (e) => {
        const p = e.detail.totalProgress;
        if (p > highWater) {
            highWater = p;
            progressBar.style.width = (p * 100) + '%';
        }
    });

    modelViewer.addEventListener('load', () => {
        modelLoaded = true;
        highWater = 0;
        progressBar.style.width = '0%';
        setLoaderVisible(false);
    });

    modelToggle.addEventListener('change', () => {
        const withAntenna = modelToggle.checked;
        document.getElementById('label-pcb').classList.toggle('switch-active', !withAntenna);
        document.getElementById('label-antenna').classList.toggle('switch-active', withAntenna);
        modelLoaded = false;
        highWater = 0;
        progressBar.style.width = '0%';
        setLoaderVisible(true);
        modelViewer.setAttribute('src', withAntenna ? MODELS.antenna : MODELS.pcb);
    });
</script>

<script>
    // Tab button handlers.
    let defaultTabName = sessionStorage.getItem("tab");
    for (let tabButton of document.getElementsByClassName("tablinks")) {
        tabButton.onclick = (event) => {
            openTab(event.target.id.split("-")[0]);
        }

        if (defaultTabName == null) {
            defaultTabName = tabButton.id.split("-")[0];
        }
    }

    // Default tab opening.
    if (defaultTabName) {
        openTab(defaultTabName);
    } else {
        const defaultTabButton = document.getElementById(`${defaultTabName}-btn`);
        openTab(defaultTabButton.id.split("-")[0]);
    }
</script>



<script>
    const PATH = "pictures/dokumentacne_foto/";
    let descriptions = {};

    async function loadDescriptions() {
        try {
            const response = await fetch('metadata/descriptions.json');
            descriptions = await response.json();
        } catch (e) {
            console.error('Failed to load descriptions JSON:', e);
        }
    }

    async function loadGallery() {
        const container = document.getElementById('galleryContainer');

        try {
            const response = await fetch(PATH + 'filelist.json');
            const files = await response.json();

            files.forEach(file => {
                const ext = file.split('.').pop().toLowerCase();
                const desc = descriptions[file] || '';
                const wrapper = document.createElement('div');
                wrapper.className = 'gallery';

                if (['jpg', 'jpeg', 'png', 'webp'].includes(ext)) {
                    // Wrap in GLightbox anchor — click opens full-size in lightbox
                    const anchor = document.createElement('a');
                    anchor.href = PATH + file;
                    anchor.className = 'glightbox';
                    anchor.dataset.description = desc;

                    const img = document.createElement('img');
                    img.src = PATH + file;
                    img.loading = 'lazy';
                    img.alt = desc || file;


                    anchor.appendChild(img);
                    wrapper.appendChild(anchor);

                } else if (ext === 'mp4') {
                    // Wrap in GLightbox anchor — click opens video in lightbox
                    const anchor = document.createElement('a');
                    anchor.href = PATH + file;
                    anchor.className = 'glightbox';
                    anchor.dataset.type = 'video';
                    anchor.dataset.description = desc;

                    // Thumbnail: muted video (first frame), src set lazily
                    const thumb = document.createElement('video');
                    thumb.muted = true;
                    thumb.playsInline = true;
                    thumb.preload = 'none';
                    thumb.classList.add('video-thumb');
                    thumb.dataset.src = PATH + file;

                    const playIcon = document.createElement('div');
                    playIcon.className = 'play-icon';
                    playIcon.textContent = '▶';

                    anchor.appendChild(thumb);
                    anchor.appendChild(playIcon);
                    wrapper.appendChild(anchor);
                }

                if (desc) {
                    const descEl = document.createElement('div');
                    descEl.className = 'desc';
                    descEl.textContent = desc;
                    wrapper.appendChild(descEl);
                }

                container.appendChild(wrapper);
            });

            // Lazy-load video thumbnails when they scroll into view
            const videoObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (!entry.isIntersecting) return;
                    const video = entry.target;
                    const source = document.createElement('source');
                    source.src = video.dataset.src;
                    source.type = 'video/mp4';
                    video.appendChild(source);
                    video.load();
                    videoObserver.unobserve(video);
                });
            }, { rootMargin: '200px' });

            container.querySelectorAll('video.video-thumb').forEach(v => videoObserver.observe(v));

            // Initialize GLightbox after all items are in the DOM
            GLightbox({
                selector: '.glightbox',
                touchNavigation: true,
                loop: true,
                closeButton: true,
            });

        } catch (e) {
            console.error('Failed to load gallery:', e);
        }
    }

    loadDescriptions().then(loadGallery);
</script>
